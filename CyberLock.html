<script>
(function(){
  function decode(id){
    var b=document.getElementById(id).textContent.trim();
    var bin=atob(b), bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  var tabs={demo:{t:document.getElementById('t-demo'),f:document.getElementById('f-demo'),p:'p-demo',loaded:false},
            pres:{t:document.getElementById('t-pres'),f:document.getElementById('f-pres'),p:'p-pres',loaded:false}};
  function show(name){
    Object.keys(tabs).forEach(function(k){
      var x=tabs[k], on=k===name;
      x.t.setAttribute('aria-selected',String(on));
      x.f.hidden=!on;
      if(on&&!x.loaded){ x.f.srcdoc=decode(x.p); x.loaded=true; }
    });
  }
  Object.keys(tabs).forEach(function(k){ tabs[k].t.addEventListener('click',function(){show(k);}); });
  show('demo');
})();
</script>
